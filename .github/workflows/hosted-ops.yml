name: Scheduled jobs

on:
  schedule:
    - cron: "45 11 * * 1-5"
    - cron: "25 */2 * * *"
    - cron: "40 22,6,14 * * *"
    - cron: "30 3 * * 1-5"
    - cron: "10 11 * * 1-5"
    - cron: "30 11 * * 1-5"
    - cron: "0 12 * * 1-5"
    - cron: "0 18 * * 6"
    - cron: "0 22 * * 6"
    - cron: "0 3 * * 0"
    - cron: "0 22 * * 0"
  workflow_dispatch:
    inputs:
      job:
        description: Job
        required: true
        type: choice
        default: market-reference
        options:
          - daily-refresh
          - file-first-stage
          - file-first-apply
          - market-reference
          - market-history
          - market-profiles
          - market-fundamentals
          - weekly-books
          - weekly-knowledge
          - weekly-depth
          - weekly-prewarm

concurrency:
  group: jobs-${{ github.event.inputs.job || github.event.schedule || 'manual' }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  FINROBOT_PK_PSX_DPS_RELAY_ROLE: ops
  FINROBOT_PK_INGEST_WORKERS: "1"
  FINROBOT_PK_PACE_LIMIT: "4"
  FINROBOT_PK_CACHE_BACKEND: redis
  FINROBOT_PK_ENABLE_REDIS_CACHE: "true"
  FINROBOT_PK_PERSISTENCE_BACKEND: mongo
  FINROBOT_PK_ENABLE_PERSISTENCE: "true"
  FINROBOT_PK_DEBUG: "false"
  FINROBOT_PK_LOG_LEVEL: INFO
  FINROBOT_PK_TIMEZONE: Asia/Karachi
  FINROBOT_PK_CURRENCY: PKR
  FINROBOT_PK_GAP_MAX_LOAD: "99"
  FINROBOT_PK_WEB_BASE_URL: ${{ secrets.WEB_BASE_URL }}
  FINROBOT_PK_GAP_HOME_URL: ${{ secrets.GAP_HOME_URL }}
  FINROBOT_PK_GAP_HEALTH_URL: ${{ secrets.GAP_HEALTH_URL }}
  FINROBOT_PK_MONGODB_URL: ${{ secrets.FINROBOT_PK_MONGODB_URL }}
  FINROBOT_PK_MONGODB_DATABASE: ${{ secrets.FINROBOT_PK_MONGODB_DATABASE }}
  FINROBOT_PK_REDIS_URL: ${{ secrets.FINROBOT_PK_REDIS_URL }}
  FINROBOT_PK_PSX_DPS_RELAY_URL: ${{ secrets.FINROBOT_PK_PSX_DPS_RELAY_URL }}
  FINROBOT_PK_PSX_DPS_RELAY_TOKEN: ${{ secrets.FINROBOT_PK_PSX_DPS_RELAY_TOKEN }}

jobs:
  daily-refresh:
    if: >
      github.repository == 'AbdulWahabRaza123/pehlesamjho-ops' &&
      ((github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'daily-refresh') ||
       (github.event_name == 'schedule' && github.event.schedule == '45 11 * * 1-5'))
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-app
        with:
          deploy-key: ${{ secrets.PSX_DEPLOY_KEY }}
          source-repo: ${{ secrets.SOURCE_REPO }}
      - name: Run
        working-directory: app
        run: uv run --extra data --extra mongo --extra redis python scripts/daily_market_refresh.py --workers 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daily-refresh-${{ github.run_id }}
          path: app/logs/daily-refresh-latest.json
          retention-days: 5
          if-no-files-found: ignore

  file-first-stage:
    if: >
      github.repository == 'AbdulWahabRaza123/pehlesamjho-ops' &&
      ((github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'file-first-stage') ||
       (github.event_name == 'schedule' && github.event.schedule == '25 */2 * * *'))
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-app
        with:
          deploy-key: ${{ secrets.PSX_DEPLOY_KEY }}
          source-repo: ${{ secrets.SOURCE_REPO }}
      - name: Run
        working-directory: app
        run: >
          uv run --extra data --extra mongo --extra redis
          python scripts/run_file_first_gap_gather.py
          --stage-only --universe --stage-batch 40 --history-batch 2 --proof-limit 400
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: file-first-stage-${{ github.run_id }}
          path: |
            app/logs/file-first-gap-latest.json
            app/logs/file-first-gap-cursor.json
            app/data/portable/staging/
          retention-days: 3
          if-no-files-found: ignore

  file-first-apply:
    if: >
      github.repository == 'AbdulWahabRaza123/pehlesamjho-ops' &&
      ((github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'file-first-apply') ||
       (github.event_name == 'schedule' && github.event.schedule == '40 22,6,14 * * *'))
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-app
        with:
          deploy-key: ${{ secrets.PSX_DEPLOY_KEY }}
          source-repo: ${{ secrets.SOURCE_REPO }}
      - name: Run
        working-directory: app
        run: |
          set -euo pipefail
          uv run --extra data --extra mongo --extra redis \
            python scripts/run_file_first_gap_gather.py \
            --stage-only --universe --stage-batch 40 --history-batch 2 --proof-limit 400
          uv run --extra data --extra mongo --extra redis \
            python scripts/run_file_first_gap_gather.py --apply-only

  market-reference:
    if: >
      github.repository == 'AbdulWahabRaza123/pehlesamjho-ops' &&
      ((github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'market-reference') ||
       (github.event_name == 'schedule' && github.event.schedule == '30 3 * * 1-5'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-app
        with:
          deploy-key: ${{ secrets.PSX_DEPLOY_KEY }}
          source-repo: ${{ secrets.SOURCE_REPO }}
      - name: Run
        working-directory: app
        run: >
          uv run --extra data --extra mongo --extra redis
          python scripts/run_market_collector.py
          symbols screener sector_summary circuit_breakers eligible_scrips payouts

  market-history:
    if: >
      github.repository == 'AbdulWahabRaza123/pehlesamjho-ops' &&
      ((github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'market-history') ||
       (github.event_name == 'schedule' && github.event.schedule == '10 11 * * 1-5'))
    runs-on: ubuntu-latest
    # 40 paced EOD pulls often exceeded 60m; prefer smaller batches + skip-fresh in collector.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-app
        with:
          deploy-key: ${{ secrets.PSX_DEPLOY_KEY }}
          source-repo: ${{ secrets.SOURCE_REPO }}
      - name: Run
        working-directory: app
        run: >
          uv run --extra data --extra mongo --extra redis
          python scripts/run_market_collector.py --history-only --history-limit 20

  market-profiles:
    if: >
      github.repository == 'AbdulWahabRaza123/pehlesamjho-ops' &&
      ((github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'market-profiles') ||
       (github.event_name == 'schedule' && github.event.schedule == '30 11 * * 1-5'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-app
        with:
          deploy-key: ${{ secrets.PSX_DEPLOY_KEY }}
          source-repo: ${{ secrets.SOURCE_REPO }}
      - name: Run
        working-directory: app
        run: >
          uv run --extra data --extra mongo --extra redis
          python scripts/run_market_collector.py --profile-limit 40 --actions-from-stored

  market-fundamentals:
    if: >
      github.repository == 'AbdulWahabRaza123/pehlesamjho-ops' &&
      ((github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'market-fundamentals') ||
       (github.event_name == 'schedule' && github.event.schedule == '0 12 * * 1-5'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-app
        with:
          deploy-key: ${{ secrets.PSX_DEPLOY_KEY }}
          source-repo: ${{ secrets.SOURCE_REPO }}
      - name: Run
        working-directory: app
        run: >
          uv run --extra data --extra mongo --extra redis
          python scripts/run_fundamentals_collector.py --limit 12

  weekly-books:
    if: >
      github.repository == 'AbdulWahabRaza123/pehlesamjho-ops' &&
      ((github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'weekly-books') ||
       (github.event_name == 'schedule' && github.event.schedule == '0 18 * * 6'))
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-app
        with:
          deploy-key: ${{ secrets.PSX_DEPLOY_KEY }}
          source-repo: ${{ secrets.SOURCE_REPO }}
      - name: Run
        working-directory: app
        run: uv run --extra data --extra mongo --extra redis python scripts/weekly_books_refresh.py

  weekly-knowledge:
    if: >
      github.repository == 'AbdulWahabRaza123/pehlesamjho-ops' &&
      ((github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'weekly-knowledge') ||
       (github.event_name == 'schedule' && github.event.schedule == '0 22 * * 6'))
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-app
        with:
          deploy-key: ${{ secrets.PSX_DEPLOY_KEY }}
          source-repo: ${{ secrets.SOURCE_REPO }}
      - name: Run
        working-directory: app
        run: uv run --extra data python scripts/weekly_knowledge.py

  weekly-depth:
    if: >
      github.repository == 'AbdulWahabRaza123/pehlesamjho-ops' &&
      ((github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'weekly-depth') ||
       (github.event_name == 'schedule' && github.event.schedule == '0 3 * * 0'))
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-app
        with:
          deploy-key: ${{ secrets.PSX_DEPLOY_KEY }}
          source-repo: ${{ secrets.SOURCE_REPO }}
      - name: Run
        working-directory: app
        run: >
          uv run --extra data --extra mongo --extra redis
          python scripts/weekly_depth_refresh.py --sofp-limit 12

  weekly-prewarm:
    if: >
      github.repository == 'AbdulWahabRaza123/pehlesamjho-ops' &&
      ((github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'weekly-prewarm') ||
       (github.event_name == 'schedule' && github.event.schedule == '0 22 * * 0'))
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-app
        with:
          deploy-key: ${{ secrets.PSX_DEPLOY_KEY }}
          source-repo: ${{ secrets.SOURCE_REPO }}
          extras: "--extra data --extra mongo --extra redis --extra intelligence"
      - name: Run
        working-directory: app
        run: uv run --extra data python scripts/nightly_prewarm.py
